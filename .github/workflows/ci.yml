name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: moon version
        run: moon version

      - name: Format check
        run: |
          moon fmt
          git diff --exit-code

      - name: Unit tests + embedded toml-test conformance
        run: moon test

      - name: Build toml2json CLI (native)
        run: moon build --target native cmd/toml2json

      - name: toml-test conformance via CLI
        run: python3 scripts/run_toml_test.py

      - name: Interface check
        run: |
          moon info
          git diff --exit-code
